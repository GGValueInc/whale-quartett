<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wal-Quartett 🐋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .btn.active {
            background: #00d4ff;
            color: #1e3c72;
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(145deg, #ffffff 0%, #e6f3ff 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            color: #1e3c72;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px) rotate(1deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .card-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .card-header h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .card-header .scientific {
            font-style: italic;
            opacity: 0.8;
            font-size: 0.9em;
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            position: relative;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-image .placeholder {
            font-size: 5em;
            opacity: 0.5;
        }

        .card-stats {
            padding: 15px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(30, 60, 114, 0.1);
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .stat-icon {
            font-size: 1.2em;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1em;
            color: #2a5298;
        }

        .card-footer {
            background: rgba(30, 60, 114, 0.05);
            padding: 12px 15px;
            font-size: 0.85em;
            color: #555;
            border-top: 1px solid rgba(30, 60, 114, 0.1);
        }

        .card-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            color: #1e3c72;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .game-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .game-mode.active {
            display: flex;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            color: #1e3c72;
        }

        .compare-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 20px 0;
        }

        .stat-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .stat-btn {
            padding: 15px;
            border: 2px solid #1e3c72;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .stat-btn:hover {
            background: #1e3c72;
            color: white;
        }

        .back-btn {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
            .compare-area {
                grid-template-columns: 1fr;
            }
        }

        .sort-indicator {
            display: inline-block;
            margin-left: 5px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐋 Wal-Quartett</h1>
        <p>32 majestätische Walarten im Vergleich</p>
    </div>

    <div class="controls">
        <button class="btn active" onclick="showAll()">Alle Karten</button>
        <button class="btn" onclick="sortBy('weight')">Gewicht ⚖️</button>
        <button class="btn" onclick="sortBy('length')">Länge 📏</button>
        <button class="btn" onclick="sortBy('lifespan')">Lebenserwartung ⏳</button>
        <button class="btn" onclick="sortBy('dive')">Tauchgang 🤿</button>
        <button class="btn" onclick="startGame()">Spiel starten 🎮</button>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="game-mode" id="gameMode">
        <div class="game-container">
            <h2>🎮 Quartett-Spiel</h2>
            <p>Wähle eine Kategorie - höherer Wert gewinnt!</p>
            <div class="compare-area" id="compareArea"></div>
            <div class="stat-selector" id="statSelector"></div>
            <button class="btn back-btn" onclick="closeGame()">Zurück zur Übersicht</button>
        </div>
    </div>

    <script>
        const whales = [
            { id: 1, name: "Blauwal", scientific: "Balaenoptera musculus", weight: 190, length: 33.0, lifespan: 90, dive: 15, fact: "Herz so groß wie ein Kleinwagen, Zunge wie ein Elefant: Der Blauwal ist das schwerste Lebewesen, das je existierte.", emoji: "🐋" },
            { id: 2, name: "Finnwal", scientific: "Balaenoptera physalus", weight: 80, length: 27.3, lifespan: 90, dive: 15, fact: "Mit bis zu 47 km/h der schnellste Großwal. Sein Rücken hat eine charakteristische Sichelfinne.", emoji: "🐋" },
            { id: 3, name: "Seiwal", scientific: "Balaenoptera borealis", weight: 28.5, length: 19.5, lifespan: 74, dive: 20, fact: "Frisst täglich bis zu 900 kg Krill und Plankton. Einmal fast ausgerottet durch industriellen Walfang.", emoji: "🐋" },
            { id: 4, name: "Brydewal", scientific: "Balaenoptera brydei", weight: 40, length: 16.5, lifespan: 72, dive: 20, fact: "Dreifache Kiemenfalten auf dem Kopf machen ihn eindeutig identifizierbar. Tropischer Bewohner der warmen Ozeane.", emoji: "🐋" },
            { id: 5, name: "Zwergwal", scientific: "Balaenoptera acutorostrata", weight: 10, length: 10.0, lifespan: 50, dive: 17, fact: "Nur sieben Meter lang, aber neugierig und wendig. Taucht oft vor Walbeobachtungsbooten auf.", emoji: "🐳" },
            { id: 6, name: "Antarktischer Zwergwal", scientific: "Balaenoptera bonaerensis", weight: 11, length: 10.8, lifespan: 50, dive: 15, fact: "Wurde erst 1990 als eigene Art anerkannt. Tarnung mit weißen Flügelflecken im Eismeer.", emoji: "🐳" },
            { id: 7, name: "Omuras Wal", scientific: "Balaenoptera omurai", weight: 33, length: 12.0, lifespan: 60, dive: 18, fact: "Eine der jüngsten Walarten überhaupt: Erst 2003 wissenschaftlich beschrieben. Extrem scheu und selten.", emoji: "🐋" },
            { id: 8, name: "Rice-Wal", scientific: "Balaenoptera ricei", weight: 25, length: 11.5, lifespan: 55, dive: 16, fact: "Lebt ausschließlich im Golf von Mexiko und wurde 2021 als eigene Art bestätigt. Nur etwa 100 Individuen.", emoji: "🐋" },
            { id: 9, name: "Buckelwal", scientific: "Megaptera novaeangliae", weight: 40, length: 18.0, lifespan: 80, dive: 30, fact: "Spektakuläre Sprünge und Stundenlange, komplexe Gesänge, die Hunderte von Kilometern weit hörbar sind.", emoji: "🐋" },
            { id: 10, name: "Grauwal", scientific: "Eschrichtius robustus", weight: 35, length: 15.0, lifespan: 70, dive: 8, fact: "Legt jährlich rund 20.000 Kilometer zurück zwischen kalten Futtergründen und tropischen Geburtsgewässern.", emoji: "🐋" },
            { id: 11, name: "Zwergbuckelwal", scientific: "Megaptera novaeangliae subsp.", weight: 28, length: 15.0, lifespan: 60, dive: 20, fact: "Kleinste Population der Buckelwale im Arabischen Meer. Genetisch isoliert seit über 70.000 Jahren.", emoji: "🐳" },
            { id: 12, name: "Atlantischer Nordkaper", scientific: "Eubalaena glacialis", weight: 70, length: 18.0, lifespan: 70, dive: 20, fact: "Nur noch etwa 350 Exemplare leben an der Ostküste Nordamerikas. Bootskollisionen sind die größte Bedrohung.", emoji: "🐋" },
            { id: 13, name: "Pazifischer Nordkaper", scientific: "Eubalaena japonica", weight: 80, length: 20.0, lifespan: 70, dive: 25, fact: "Schätzungsweise nur 500 Individuen. Die seltenste Walart des Nordpazifiks. Wird von Eisbären gejagt.", emoji: "🐋" },
            { id: 14, name: "Südkaper", scientific: "Eubalaena australis", weight: 80, length: 18.0, lifespan: 80, dive: 20, fact: "Ein Erfolgsmodell des Walsschutzes: Die Population wuchs von 300 auf über 15.000 Tiere.", emoji: "🐋" },
            { id: 15, name: "Grönlandwal", scientific: "Balaena mysticetus", weight: 100, length: 20.0, lifespan: 200, dive: 40, fact: "Kann über 200 Jahre alt werden! Das macht ihn zum langlebigsten Säugetier der Erde.", emoji: "🐋" },
            { id: 16, name: "Schwertwal / Orca", scientific: "Orcinus orca", weight: 9, length: 9.8, lifespan: 80, dive: 17, fact: "Jede Population hat einen eigenen Dialekt. Weibchen führen oft die Herde und werden über 90 Jahre alt.", emoji: "🐬" },
            { id: 17, name: "Kurzflossen-Grindwal", scientific: "Globicephala macrorhynchus", weight: 3.6, length: 7.2, lifespan: 45, dive: 25, fact: "Lebt in festen Matrilinien, die das Leben lang zusammenbleiben. Tragisch bekannt durch Strandungen.", emoji: "🐬" },
            { id: 18, name: "Langflossen-Grindwal", scientific: "Globicephala melas", weight: 5.0, length: 6.5, lifespan: 60, dive: 22, fact: "Europas häufigster Großwal. Sein Gehirn ist doppelt so schwer wie das eines Menschen.", emoji: "🐬" },
            { id: 19, name: "Weißer Beluga", scientific: "Delphinapterus leucas", weight: 1.6, length: 5.5, lifespan: 50, dive: 25, fact: "Kann den Kopf unabhängig drehen und mimt menschliche Stimmen. Im Winter bleibt Eis frei.", emoji: "🐬" },
            { id: 20, name: "Narwal", scientific: "Monodon monoceros", weight: 1.6, length: 5.5, lifespan: 50, dive: 25, fact: "Der Stoßzahn ist ein verlängerter Zahn mit bis zu 10 Millionen Nervenenden. Er dient als Sinnesorgan.", emoji: "🦄" },
            { id: 21, name: "Großer Tümmler", scientific: "Tursiops truncatus", weight: 0.65, length: 4.2, lifespan: 50, dive: 10, fact: "Nutzt Werkzeuge: Trägt Schwämme auf der Schnauze, um sich am Meeresboden zu schützen.", emoji: "🐬" },
            { id: 22, name: "Pseudorca", scientific: "Pseudorca crassidens", weight: 2.2, length: 6.1, lifespan: 55, dive: 18, fact: "Jagt gemeinsam mit Delfinen und Tümmlern. Eine seltene Art, die oft mit Orcas verwechselt wird.", emoji: "🐬" },
            { id: 23, name: "Cuvier-Schnabelwal", scientific: "Ziphius cavirostris", weight: 3.1, length: 7.5, lifespan: 60, dive: 90, fact: "Rekord-Taucher: Hält den Tiefenrekord mit fast 3.000 Metern und über zwei Stunden Tauchgangsdauer.", emoji: "🐋" },
            { id: 24, name: "Nördlicher Bottlenose-Whale", scientific: "Hyperoodon ampullatus", weight: 7.5, length: 10.0, lifespan: 40, dive: 70, fact: "Die markante Melone auf dem Kopf dient der Echolokation. Kuriose Neugier für Menschen und Schiffe.", emoji: "🐋" },
            { id: 25, name: "Perrin-Schnabelwal", scientific: "Mesoplodon perrini", weight: 1.2, length: 4.0, lifespan: 45, dive: 60, fact: "Erst 2002 als eigene Art erkannt. Die kleinste Mesoplodon-Art, kaum größer als ein Delfin.", emoji: "🐳" },
            { id: 26, name: "Blainvilles Schnabelwal", scientific: "Mesoplodon densirostris", weight: 1.1, length: 4.9, lifespan: 50, dive: 55, fact: "Männchen tragen bizarre, kastanienförmige Zähne am Unterkiefer, die aus der Schnauze herausragen.", emoji: "🐳" },
            { id: 27, name: "Pottwal", scientific: "Physeter macrocephalus", weight: 57, length: 20.5, lifespan: 70, dive: 90, fact: "Gehirn wiegt bis zu 9 Kilogramm – das größte der Tierwelt. Er jagt riesige Tintenfische in der Tiefsee.", emoji: "🐋" },
            { id: 28, name: "Zwergpottwal", scientific: "Kogia breviceps", weight: 4.5, length: 3.8, lifespan: 35, dive: 25, fact: "Setzt bei Gefahr eine tintenartige Kotwolke frei als Ablenkungsmanöver. Nur etwa 3,5 Meter lang.", emoji: "🐳" },
            { id: 29, name: "Kleiner Zwergpottwal", scientific: "Kogia sima", weight: 0.45, length: 2.7, lifespan: 30, dive: 20, fact: "Mit 2,7 Metern der kleinste Wal der Welt. Fast identisch mit seinem großen Bruder, aber deutlich winziger.", emoji: "🐳" },
            { id: 30, name: "Andenkajalvogelwal", scientific: "Berardius arnuxii", weight: 8, length: 12.0, lifespan: 50, dive: 80, fact: "Der einzige Schnabelwal der Südhalbkugel. Sein Name stammt von einem französischen Schiffsarzt.", emoji: "🐋" },
            { id: 31, name: "Bairds Schnabelwal", scientific: "Berardius bairdii", weight: 12, length: 12.8, lifespan: 55, dive: 85, fact: "Größter Vertreter der Schnabelwale mit über 12 Metern Länge. Präferiert tiefe Tiefsee-Gräben.", emoji: "🐋" },
            { id: 32, name: "Indopazifischer Buckelwal", scientific: "Indopacetus pacificus", weight: 13, length: 9.8, lifespan: 60, dive: 45, fact: "Extrem seltene Tiefseeart. Erst zwei Mal lebend gesichtet. Gehört zur gleichen Familie wie Ziphius.", emoji: "🐋" }
        ];

        // Lokale Bilder (alle 32 Walarten)
        const whaleImages = {
            1: "whale_images/1.jpg",
            2: "whale_images/2.jpg",
            3: "whale_images/3.jpg",
            4: "whale_images/4.jpg",
            5: "whale_images/5.jpg",
            6: "whale_images/6.jpg",
            7: "whale_images/7.jpg",
            8: "whale_images/8.jpg",
            9: "whale_images/9.jpg",
            10: "whale_images/10.jpg",
            11: "whale_images/11.jpg",
            12: "whale_images/12.jpg",
            13: "whale_images/13.jpg",
            14: "whale_images/14.jpg",
            15: "whale_images/15.jpg",
            16: "whale_images/16.jpg",
            17: "whale_images/17.jpg",
            18: "whale_images/18.jpg",
            19: "whale_images/19.jpg",
            20: "whale_images/20.jpg",
            21: "whale_images/21.jpg",
            22: "whale_images/22.jpg",
            23: "whale_images/23.jpg",
            24: "whale_images/24.jpg",
            25: "whale_images/25.jpg",
            26: "whale_images/26.jpg",
            27: "whale_images/27.jpg",
            28: "whale_images/28.jpg",
            29: "whale_images/29.jpg",
            30: "whale_images/30.jpg",
            31: "whale_images/31.jpg",
            32: "whale_images/32.jpg"
        };

        let currentSort = 'id';
        let gameCards = [];

        function renderCards(cardsToRender = whales) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = cardsToRender.map(whale => `
                <div class="card" onclick="selectCard(${whale.id})">
                    <div class="card-number">${whale.id}</div>
                    <div class="card-header">
                        <h3>${whale.emoji} ${whale.name}</h3>
                        <div class="scientific">${whale.scientific}</div>
                    </div>
                    <div class="card-image">
                        ${whaleImages[whale.id] 
                            ? `<img src="${whaleImages[whale.id]}" alt="${whale.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'placeholder\'>${whale.emoji}</div>'">`
                            : `<div class="placeholder">${whale.emoji}</div>`
                        }
                    </div>
                    <div class="card-stats">
                        <div class="stat">
                            <span class="stat-label"><span class="stat-icon">⚖️</span> Gewicht</span>
                            <span class="stat-value">${whale.weight} t</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label"><span class="stat-icon">📏</span> Länge</span>
                            <span class="stat-value">${whale.length} m</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label"><span class="stat-icon">⏳</span> Lebenserwartung</span>
                            <span class="stat-value">${whale.lifespan} J.</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label"><span class="stat-icon">🤿</span> Tauchgang</span>
                            <span class="stat-value">${whale.dive} min</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        💡 ${whale.fact}
                    </div>
                </div>
            `).join('');
        }

        function sortBy(criteria) {
            const buttons = document.querySelectorAll('.controls .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const sorted = [...whales].sort((a, b) => b[criteria] - a[criteria]);
            renderCards(sorted);
        }

        function showAll() {
            const buttons = document.querySelectorAll('.controls .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards(whales);
        }

        function startGame() {
            gameCards = [...whales].sort(() => Math.random() - 0.5);
            const playerCard = gameCards[0];
            const computerCard = gameCards[1];
            
            document.getElementById('gameMode').classList.add('active');
            
            document.getElementById('compareArea').innerHTML = `
                <div class="card" style="transform: scale(0.9);">
                    <div class="card-header"><h3>🎮 Deine Karte</h3></div>
                    <div class="card-image"><div class="placeholder">${playerCard.emoji}</div></div>
                    <div class="card-stats">
                        <div class="stat"><span>${playerCard.name}</span></div>
                        <div class="stat"><span>⚖️ ${playerCard.weight} t</span></div>
                        <div class="stat"><span>📏 ${playerCard.length} m</span></div>
                        <div class="stat"><span>⏳ ${playerCard.lifespan} J.</span></div>
                        <div class="stat"><span>🤿 ${playerCard.dive} min</span></div>
                    </div>
                </div>
                <div class="card" style="transform: scale(0.9); opacity: 0.7;">
                    <div class="card-header"><h3>🤖 Computer</h3></div>
                    <div class="card-image"><div class="placeholder">❓</div></div>
                    <div class="card-stats">
                        <div class="stat"><span>???</span></div>
                        <div class="stat"><span>⚖️ ???</span></div>
                        <div class="stat"><span>📏 ???</span></div>
                        <div class="stat"><span>⏳ ???</span></div>
                        <div class="stat"><span>🤿 ???</span></div>
                    </div>
                </div>
            `;

            document.getElementById('statSelector').innerHTML = `
                <button class="stat-btn" onclick="compare('weight')">⚖️ Gewicht</button>
                <button class="stat-btn" onclick="compare('length')">📏 Länge</button>
                <button class="stat-btn" onclick="compare('lifespan')">⏳ Lebenserwartung</button>
                <button class="stat-btn" onclick="compare('dive')">🤿 Tauchgang</button>
            `;
        }

        function compare(stat) {
            const playerCard = gameCards[0];
            const computerCard = gameCards[1];
            const playerWins = playerCard[stat] >= computerCard[stat];
            
            document.getElementById('compareArea').innerHTML = `
                <div class="card" style="transform: scale(0.9); border: 3px solid ${playerWins ? 'green' : 'red'};">
                    <div class="card-header"><h3>🎮 Du ${playerWins ? '✅' : '❌'}</h3></div>
                    <div class="card-image"><div class="placeholder">${playerCard.emoji}</div></div>
                    <div class="card-stats">
                        <div class="stat"><span>${playerCard.name}</span></div>
                        <div class="stat"><span>⚖️ ${playerCard.weight} t</span></div>
                        <div class="stat"><span>📏 ${playerCard.length} m</span></div>
                        <div class="stat"><span>⏳ ${playerCard.lifespan} J.</span></div>
                        <div class="stat"><span>🤿 ${playerCard.dive} min</span></div>
                    </div>
                </div>
                <div class="card" style="transform: scale(0.9); border: 3px solid ${playerWins ? 'red' : 'green'};">
                    <div class="card-header"><h3>🤖 Computer ${playerWins ? '❌' : '✅'}</h3></div>
                    <div class="card-image"><div class="placeholder">${computerCard.emoji}</div></div>
                    <div class="card-stats">
                        <div class="stat"><span>${computerCard.name}</span></div>
                        <div class="stat"><span>⚖️ ${computerCard.weight} t</span></div>
                        <div class="stat"><span>📏 ${computerCard.length} m</span></div>
                        <div class="stat"><span>⏳ ${computerCard.lifespan} J.</span></div>
                        <div class="stat"><span>🤿 ${computerCard.dive} min</span></div>
                    </div>
                </div>
            `;

            document.getElementById('statSelector').innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; font-size: 1.5em; padding: 20px;">
                    ${playerWins ? '🎉 Du gewinnst!' : '😔 Computer gewinnt!'}
                    <br><br>
                    <button class="btn" onclick="startGame()">Nochmal spielen</button>
                </div>
            `;
        }

        function closeGame() {
            document.getElementById('gameMode').classList.remove('active');
        }

        function selectCard(id) {
            console.log('Selected card:', id);
        }

        // Initial render
        renderCards();
    </script>
</body>
</html>
