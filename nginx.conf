server {
    listen 80;
    server_name wal-quartett.valueinc.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wal-quartett.valueinc.de;
    
    ssl_certificate /etc/letsencrypt/live/wal-quartett.valueinc.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wal-quartett.valueinc.de/privkey.pem;
    
    root /var/www/wal-quartett;
    index index.html;
    
    # KEIN Cache fuer index.html (neue Versionen sofort sichtbar)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }
    
    # Alle Dateien direkt ausliefern
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Datenschutz
    location = /privacy {
        try_files /privacy.html =404;
    }
    
    # Impressum
    location = /impressum {
        try_files /impressum.html =404;
    }
    
    # Feedback Dashboard
    location = /feedback {
        rewrite ^/feedback$ /feedback.html last;
    }
    
    # Analytics Dashboard (GoAccess) — PASSWORT-GESCHÜTZT
    location = /analytics {
        rewrite ^/analytics$ /analytics/index.html last;
    }
    location /analytics/ {
        auth_basic "Wal-Quartett Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd_stats;
        alias /var/www/wal-quartett/analytics/;
        try_files $uri $uri/ =404;
    }
    
    # WebSocket fuer 1v1
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health Check
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Deck API
    location = /deck {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Stats API — PASSWORT-GESCHÜTZT
    location = /stats {
        auth_basic "Wal-Quartett Stats";
        auth_basic_user_file /etc/nginx/.htpasswd_stats;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization Header nicht an Node.js weiterleiten
        proxy_set_header Authorization "";
    }
    
    # API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
