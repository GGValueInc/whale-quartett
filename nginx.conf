server {
    listen 80;
    server_name wal-quartett.valueinc.de;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wal-quartett.valueinc.de;
    
    ssl_certificate /etc/letsencrypt/live/wal-quartett.valueinc.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wal-quartett.valueinc.de/privkey.pem;
    
    root /var/www/wal-quartett;
    index index.html;
    
    # Alle Dateien direkt ausliefern
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Feedback Dashboard (ohne .html)
    location = /feedback {
        rewrite ^/feedback$ /feedback.html last;
    }
    
    # WebSocket fuer 1v1 (lokaler Node.js Server auf Port 3000)
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
    
    # Stats + Health + Deck + Feedback API (Port 3000)
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
    }
    
    location = /deck {
        proxy_pass http://127.0.0.1:3000/deck;
    }
    
    location = /stats {
        proxy_pass http://127.0.0.1:3000/stats;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
    }
}