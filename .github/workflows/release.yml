name: Auto-Release Workflow

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or package.json
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            # Prüfe ob package.json existiert
            if [ -f package.json ]; then
              VERSION=$(node -p "require('./package.json').version")
              VERSION="v${VERSION}"
            else
              VERSION="v$(date +%Y%m%d-%H%M%S)"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate CHANGELOG
        id: changelog
        run: |
          echo "## Changes in ${{ steps.get_version.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> CHANGELOG.md || true
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.version }}" >> CHANGELOG.md

      - name: Build assets
        run: |
          mkdir -p dist
          # HTML Datei kopieren falls vorhanden
          if [ -f wal_quartett.html ]; then
            cp wal_quartett.html dist/
          fi
          # Weitere Build-Schritte hier
          echo "Build completed at $(date)" > dist/BUILD_INFO.txt
          echo "Version: ${{ steps.get_version.outputs.version }}" >> dist/BUILD_INFO.txt

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          files: |
            dist/*
          generate_release_notes: true

      - name: Create Draft Release (if main branch)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Draft ${{ steps.get_version.outputs.version }}"
          body_path: CHANGELOG.md
          files: |
            dist/*
          draft: true
          prerelease: true
